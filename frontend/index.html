<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SENTINEL Demo</title>
  </head>
  <body>
    <main id="app">
      <h1>SENTINEL</h1>
      <p>Autonomous reliability and security engineer for AI agents.</p>
      <button id="run">Run Poisoned Supplier Attack</button>
      <pre id="result">Ready.</pre>
    </main>
    <script>
      document.getElementById("run").onclick = async () => {
        const result = document.getElementById("result");
        result.textContent = "Running attack...";
        const response = await fetch("/runs", { method: "POST" });
        result.textContent = JSON.stringify(await response.json(), null, 2);
      };
    </script>
  </body>
</html>
