[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ai"
version = "0.3.0"
description = "Provider-agnostic security and reliability layer for Strands Agents"
requires-python = ">=3.11"
dependencies = [
  "strands-agents>=1.0,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
]
# boto3 already arrives with strands-agents; pinned here for AWS-only deployments.
aws = [
  "boto3>=1.34,<2",
]
# Optional model provider SDKs. Install only what you use, or `.[providers]`.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
litellm = ["litellm>=1.50"]
ollama = ["ollama>=0.4"]
gemini = ["google-genai>=1.0"]
mistral = ["mistralai>=1.0"]
providers = [
  "anthropic>=0.40",
  "openai>=1.40",
  "litellm>=1.50",
  "ollama>=0.4",
  "google-genai>=1.0",
  "mistralai>=1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
